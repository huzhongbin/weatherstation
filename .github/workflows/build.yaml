name: Build ESPHome Firmware
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ESPHome firmware
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: weatherstation.yaml
          version: latest

      - name: Download bin固件
        uses: actions/upload-artifact@v4
        with:
          name: weather‑station‑firmware
          path: ./.esphome/build/*.bin
