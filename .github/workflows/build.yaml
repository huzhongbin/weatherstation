name: Build ESPHome Firmware
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output dir
        run: mkdir -p ./output

      - name: Run ESPHome docker compile
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/config \
            -v ${{ github.workspace }}/output:/build \
            esphome/esphome:latest \
            compile /config/weatherstation.yaml

      - name: Copy firmware bin
        run: cp -r ./output/* ./firmware/

      - name: Upload artifacts
  uses: actions/upload-artifact@v4
  with:
    name: esphome-firmware
    path: |
      ./**/.esphome/build/*/.pio/build/*/*.bin
