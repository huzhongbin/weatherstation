name: Build ESPHome Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome

      - name: Compile firmware
        run: esphome compile weatherstation.yaml

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weatherstation-firmware
          path: |
            ./.esphome/build/weatherstation/.pioenvs/weatherstation/*.bin
            ./.esphome/build/weatherstation/.pioenvs/weatherstation/*.uf2
