name: Build ESPHome Firmware
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome

      - name: Compile firmware
        run: esphome compile weatherstation.yaml

      - name: List build dir (debug看真实路径)
        run: |
          ls -la ~/.esphome/build/
          find ~/.esphome/build -name "firmware*.bin"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weatherstation-firmware
          path: |
            ~/.esphome/build/*/.pioenvs/*/firmware.bin
            ~/.esphome/build/*/.pioenvs/*/firmware.ota.bin
