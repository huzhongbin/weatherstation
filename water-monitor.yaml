esphome:
  name: water-monitor
  friendly_name: 净水器检测
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32‑c3‑devkit‑01
  framework:
    type: arduino

wifi:
  ssid: mijia
  password: 09081005
  ap:
    ssid: "Water‑Monitor Fallback"
    password: "12345678"

ota:
  password: "12345678"

api:

i2c:
  sda: GPIO7
  scl: GPIO6
  scan: true

uart:
  - id: tds_uart
    tx_pin: GPIO10
    rx_pin: GPIO3
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 24

globals:
  - id: tds_buf
    type: uint8_t[24]
    restore_value: no
    initial_value: '{0}'
  - id: tds_buf_idx
    type: int
    restore_value: no
    initial_value: '0'
  - id: filter1_total
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: filter2_total
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: filter3_total
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: filter4_total
    type: float
    restore_value: yes
    initial_value: '0.0'

sensor:
  # 纯水流量计 GPIO4 5160脉冲/L
  - platform: pulse_meter
    pin: GPIO4
    name: "纯水瞬时流量"
    id: pure_flow_rate
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    filters:
      - multiply: 0.0001938
    total:
      name: "纯水累计"
      id: pure_total_l
      unit_of_measurement: "L"
      accuracy_decimals: 1

  # 废水流量计 GPIO5 5160脉冲/L
  - platform: pulse_meter
    pin: GPIO5
    name: "废水瞬时流量"
    id: waste_flow_rate
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    filters:
      - multiply: 0.0001938
    total:
      name: "废水累计"
      id: waste_total_l
      unit_of_measurement: "L"
      accuracy_decimals: 1

  # 废水比
  - platform: template
    name: "废水比"
    id: waste_ratio
    unit_of_measurement: "%"
    accuracy_decimals: 1

  # RO脱盐率
  - platform: template
    name: "RO脱盐率"
    id: ro_rejection
    unit_of_measurement: "%"
    accuracy_decimals: 1

  # ADS1115 A0 进水压力 0‑1.2MPa
  - platform: ads1115
    multiplexer: 'A0_GND'
    gain: 6.144
    name: "进水压力"
    id: water_press
    unit_of_measurement: MPa
    accuracy_decimals: 3
    filters:
      - lambda: |-
          float voltage = x;
          float pressure_mpa = (voltage - 0.5) / 4.0 * 1.2;
          if(pressure_mpa < 0) pressure_mpa = 0;
          return pressure_mpa;

  # ADS1115 A1 NTC进水温度
  - platform: ads1115
    multiplexer: 'A1_GND'
    gain: 6.144
    name: "进水温度原始"
    id: ntc_raw
    internal: true
    filters:
      - lambda: |-
          float v = x;
          float r_ntc = (10000.0 * v) / (6.144 - v);
          float steinhart;
          steinhart = r_ntc / 10000.0;
          steinhart = log(steinhart);
          steinhart /= 3950.0;
          steinhart += 1.0 / (25 + 273.15);
          steinhart = 1.0 / steinhart;
          steinhart -= 273.15;
          return steinhart;

  - platform: template
    name: "进水温度"
    id: water_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1

  # TDS两路
  - platform: template
    id: tds1_sensor
    name: "TDS进水"
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
  - platform: template
    id: tds2_sensor
    name: "TDS纯水"
    unit_of_measurement: "ppm"
    accuracy_decimals: 0

  # 滤芯剩余升数
  - platform: template
    name: "滤芯1剩余(L)"
    id: filter1_remain
    unit_of_measurement: "L"
    accuracy_decimals: 0
  - platform: template
    name: "滤芯2剩余(L)"
    id: filter2_remain
    unit_of_measurement: "L"
    accuracy_decimals: 0
  - platform: template
    name: "滤芯3剩余(L)"
    id: filter3_remain
    unit_of_measurement: "L"
    accuracy_decimals: 0
  - platform: template
    name: "滤芯4剩余(L)"
    id: filter4_remain
    unit_of_measurement: "L"
    accuracy_decimals: 0

binary_sensor:
  # 仅保留高压开关GPIO21，低压、水满已移除
  - platform: gpio
    pin:
      number: GPIO21
      mode: INPUT_PULLUP
    name: "高压开关(水满)"
    id: high_press_switch

switch:
  # 手动清零滤芯，更换滤芯时点击
  - platform: template
    name: "清零滤芯1"
    turn_on_action:
      - lambda: id(filter1_total) = id(pure_total_l).state;
      - switch.turn_off: this
  - platform: template
    name: "清零滤芯2"
    turn_on_action:
      - lambda: id(filter2_total) = id(pure_total_l).state;
      - switch.turn_off: this
  - platform: template
    name: "清零滤芯3"
    turn_on_action:
      - lambda: id(filter3_total) = id(pure_total_l).state;
      - switch.turn_off: this
  - platform: template
    name: "清零滤芯4"
    turn_on_action:
      - lambda: id(filter4_total) = id(pure_total_l).state;
      - switch.turn_off: this

interval:
  - interval: 100ms
    then:
      - lambda: |-
          uint8_t byte;
          while(id(tds_uart).available()){
            byte = id(tds_uart).read();
            if(byte == 0x55){
              id(tds_buf_idx) = 0;
            }
            id(tds_buf)[id(tds_buf_idx)] = byte;
            id(tds_buf_idx)++;
            if(id(tds_buf_idx) >= 9){
              uint16_t t1 = (id(tds_buf)[2] << 8) | id(tds_buf)[3];
              uint16_t t2 = (id(tds_buf)[4] << 8) | id(tds_buf)[5];
              id(tds1_sensor).publish_state(t1);
              id(tds2_sensor).publish_state(t2);
              id(tds_buf_idx)=0;
            }
          }

  - interval: 1s
    then:
      - lambda: |-
          //温度输出
          id(water_temp).publish_state(id(ntc_raw).state);

          //废水比计算
          float pure = id(pure_total_l).state;
          float waste = id(waste_total_l).state;
          float ratio = 0;
          if(pure>0.1) ratio = (waste / pure)*100.0;
          id(waste_ratio).publish_state(ratio);

          //脱盐率
          float tds_in = id(tds1_sensor).state;
          float tds_out = id(tds2_sensor).state;
          float reject = 0;
          if(tds_in>5) reject = ((tds_in - tds_out)/tds_in)*100.0;
          id(ro_rejection).publish_state(reject);

          //滤芯剩余，手动清零，不自动重置
          const float cap1=6000.0;
          const float cap2=6000.0;
          const float cap3=12000.0;
          const float cap4=8000.0;
          float used1 = id(pure_total_l).state - id(filter1_total);
          float used2 = id(pure_total_l).state - id(filter2_total);
          float used3 = id(pure_total_l).state - id(filter3_total);
          float used4 = id(pure_total_l).state - id(filter4_total);
          id(filter1_remain).publish_state(cap1-used1);
          id(filter2_remain).publish_state(cap2-used2);
          id(filter3_remain).publish_state(cap3-used3);
          id(filter4_remain).publish_state(cap4-used4);