esphome:
  name: weather-station
  friendly_name: 终极气象站

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

wifi:
  ssid: "Mijia"
  password: "09081005"

ota:
  - platform: esphome
    password: "12345678"
  - platform: web_server

api:

logger:
  level: DEBUG

web_server:
  port: 80

uart:
  id: mod_bus
  tx_pin: GPIO15
  rx_pin: GPIO16
  baud_rate: 9600

modbus:
  uart_id: mod_bus
  flow_control_pin: GPIO17
  send_wait_time: 400ms
  turnaround_time: 300ms

modbus_controller:
  - id: temp_baro_controller
    address: 1
    update_interval: 10s
  - id: light_controller
    address: 2
    update_interval: 10s

sensor:
  - platform: modbus_controller
    id: out_temp
    modbus_controller_id: temp_baro_controller
    name: "室外温度1"
    register_type: holding
    address: 0x0000
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    id: out_hum
    modbus_controller_id: temp_baro_controller
    name: "室外湿度2"
    register_type: holding
    address: 0x0001
    unit_of_measurement: "%"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    id: out_press
    modbus_controller_id: temp_baro_controller
    name: "大气压3"
    register_type: holding
    address: 0x0002
    unit_of_measurement: "hPa"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    id: out_light
    modbus_controller_id: light_controller
    name: "光照强度4"
    register_type: holding
    address: 0x0007
    unit_of_measurement: "Lux"
    accuracy_decimals: 0
    value_type: U_DWORD
